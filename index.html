<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform 92 Kitchen — Vaggeryd</title>
<meta name="description" content="Platform 92 Kitchen i Vaggeryd. Grillad kyckling, nötkött, falafel, rullar och pommes. Beställ online, betala kontant vid leverans.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='93' fill='%2314110D' stroke='%23C9A227' stroke-width='14'/%3E%3Ctext x='100' y='134' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='108' fill='%23F4ECD8'%3E92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --void:#14110D; --surface:#1E1911; --surface-2:#262016; --surface-3:#2E2519;
  --line:rgba(201,162,39,0.22); --line-strong:rgba(201,162,39,0.4);
  --ink:#F4ECD8; --ink-dim:#C9BFA8; --ink-faint:#8a8168;
  --brass:#C9A227; --brass-bright:#E9C766;
  --pine:#20503C; --pine-light:#3A7458;
  --ember:#B4232A; --ember-bright:#D6444B;
  --display:"Bebas Neue","Arial Narrow",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --maxw:1180px;
  --radius:16px;
  --nav-h:64px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html{-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3{margin:0;}
p{margin:0;}
img,svg{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
::selection{background:var(--brass);color:#1a1508;}
:focus-visible{outline:2px solid var(--brass-bright);outline-offset:3px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
.eyebrow{font-family:var(--display);font-size:12.5px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;}

.ties{height:14px;margin:0 auto;max-width:var(--maxw);background-image:linear-gradient(90deg, var(--line) 0 2px, transparent 2px 100%),repeating-linear-gradient(90deg, var(--line-strong) 0 3px, transparent 3px 26px);background-position:0 6px, 0 0;background-size:100% 2px, 100% 14px;background-repeat:no-repeat, repeat-x;opacity:.6;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);letter-spacing:.06em;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid transparent;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;text-decoration:none;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-brass{background:var(--brass);color:#1a1508;}
.btn-brass:hover{background:var(--brass-bright);box-shadow:0 6px 22px rgba(201,162,39,.28);}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong);}
.btn-outline:hover{border-color:var(--brass);color:var(--brass-bright);}
.btn-ember{background:var(--ember);color:#fff;}
.btn-ember:hover{background:var(--ember-bright);}
.btn-ghost{background:transparent;color:var(--ink-dim);border:none;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.4;pointer-events:none;}

.topnav{position:sticky;top:0;z-index:100;background:rgba(20,17,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topnav-inner{display:flex;align-items:center;gap:16px;height:var(--nav-h);}
.brandmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;}
.brandmark svg{width:36px;height:36px;flex:none;}
.brandmark .name{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.15;display:block;}
.brandmark .sub{font-family:var(--display);font-size:9.5px;letter-spacing:.2em;color:var(--brass-bright);text-transform:uppercase;display:block;}
.navlinks{display:flex;gap:2px;margin-inline-start:18px;}
.navlinks a{font-family:var(--display);font-size:12.5px;letter-spacing:.06em;color:var(--ink-dim);text-decoration:none;padding:9px 13px;border-radius:999px;text-transform:uppercase;transition:all .15s ease;}
.navlinks a:hover{color:var(--ink);background:var(--surface);}
.nav-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px;}
.langswitch{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
.langswitch button{background:transparent;border:none;color:var(--ink-faint);font-family:var(--display);font-size:11.5px;letter-spacing:.05em;padding:6px 10px;border-radius:999px;transition:all .15s ease;}
.langswitch button.active{background:var(--brass);color:#1a1508;}
.langswitch button:not(.active):hover{color:var(--ink);}
.cart-chip{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:9px 14px;color:var(--ink);}
.cart-chip:hover{border-color:var(--brass);}
.cart-chip svg{width:17px;height:17px;color:var(--brass-bright);flex:none;}
.cart-chip .count{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--ember);color:#fff;font-family:var(--display);font-size:11px;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.cart-chip .count.zero{display:none;}
.cart-chip .amount{font-family:var(--display);font-size:13px;letter-spacing:.03em;}
.status-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:8px 13px;}
.status-pill .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--pine-light);box-shadow:0 0 7px var(--pine-light);}
.status-pill .dot.closed{background:var(--ember);box-shadow:0 0 7px var(--ember);}
.status-pill span.txt{font-family:var(--display);font-size:11.5px;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;}
@media(max-width:480px){.status-pill span.txt{display:none;}.status-pill{padding:8px;}}
.closed-banner{background:rgba(180,35,42,.15);border-bottom:1px solid rgba(180,35,42,.4);}
.closed-banner[hidden]{display:none;}
.closed-banner-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 20px;text-align:center;padding:10px 20px;font-size:13px;color:var(--ink);}
.closed-banner-inner strong.title{color:var(--ember-bright);font-family:var(--display);letter-spacing:.05em;font-size:13px;text-transform:uppercase;}
.closed-banner-inner .countdown{font-family:var(--display);letter-spacing:.03em;color:var(--ember-bright);}
.dish-add:disabled, .stepper button:disabled{opacity:.4;pointer-events:none;}
.hamburger{display:none;background:none;border:none;color:var(--ink);padding:8px;}
.hamburger svg{width:22px;height:22px;}
@media (max-width:860px){.navlinks{display:none;}.hamburger{display:flex;}}
.mobilenav{position:fixed;inset:var(--nav-h) 0 0 0;background:var(--void);z-index:99;padding:24px 20px;display:none;flex-direction:column;gap:2px;overflow-y:auto;}
.mobilenav.open{display:flex;}
.mobilenav a{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--ink);text-decoration:none;padding:16px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;}

.hero{position:relative;padding:56px 0 48px;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 50% -10%, rgba(32,80,60,.35), transparent 60%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:34px;align-items:center;}
@media(min-width:920px){.hero-inner{grid-template-columns:1.15fr .85fr;}}
.hero-eyebrow{margin-bottom:14px;}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(36px,6vw,62px);line-height:1.05;letter-spacing:-.01em;margin-bottom:18px;}
.hero .sub{font-size:17px;color:var(--ink-dim);max-width:520px;margin-bottom:28px;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;}
.station-cluster{display:flex;flex-direction:column;align-items:center;gap:18px;}
.vintage-clock{width:118px;height:118px;flex:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));}
.vintage-clock .hand{transition:transform .12s cubic-bezier(.4,2.2,.6,1);}
.board{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:20px 22px 16px;box-shadow:0 24px 70px rgba(0,0,0,.5);width:100%;}
.board-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line);}
.board-head .dot{width:8px;height:8px;border-radius:50%;background:var(--pine-light);box-shadow:0 0 8px var(--pine-light);flex:none;}
.board-head .dot.closed{background:var(--ember);box-shadow:0 0 8px var(--ember);}
.board-head span{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;}
.board-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-family:var(--display);letter-spacing:.06em;font-size:15px;padding:9px 0;border-bottom:1px dashed var(--line);}
.board-row:last-child{border-bottom:none;}
.board-row .k{color:var(--ink-faint);font-size:12px;}
.board-row .v{color:var(--brass-bright);display:inline-block;}
@media (prefers-reduced-motion:no-preference){
  .board-row .v.flip{animation:boardflip .5s ease;}
  @keyframes boardflip{0%{transform:translateY(0);opacity:1;}45%{transform:translateY(-55%);opacity:0;}55%{transform:translateY(55%);opacity:0;}100%{transform:translateY(0);opacity:1;}}
}

.section-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.section-num{font-family:var(--display);font-size:13.5px;color:var(--brass);letter-spacing:.09em;}
.section-head h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4vw,38px);}

.about{padding:56px 0;}
.about-inner{display:grid;grid-template-columns:1fr;gap:26px;margin-top:22px;}
@media(min-width:820px){.about-inner{grid-template-columns:auto 1fr;align-items:center;}}
.about-mark{width:110px;height:110px;flex:none;}
.about p{color:var(--ink-dim);font-size:16.5px;max-width:640px;}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.chip{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:var(--brass-bright);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.35);padding:7px 13px;border-radius:999px;text-transform:uppercase;}

.menu-section{padding:56px 0 20px;}
.menu-sub{color:var(--ink-dim);margin-top:8px;margin-bottom:28px;font-size:15.5px;}
.cattabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:26px;scrollbar-width:none;}
.cattabs::-webkit-scrollbar{display:none;}
.cattab{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;transition:all .15s ease;}
.cattab svg{width:18px;height:18px;color:var(--ink-faint);flex:none;}
.cattab.active{background:var(--pine);border-color:var(--pine-light);color:var(--ink);}
.cattab.active svg{color:var(--brass-bright);}
.cattab:hover:not(.active){border-color:var(--brass);color:var(--ink);}
.menu-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:680px){.menu-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1040px){.menu-grid{grid-template-columns:1fr 1fr 1fr;}}
@media (prefers-reduced-motion:no-preference){
  .menu-grid.flip .dish{animation:dishflip .32s ease backwards;}
  @keyframes dishflip{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s ease, transform .15s ease;}
.dish:hover{border-color:var(--brass);transform:translateY(-2px);}
.dish-media{position:relative;width:100%;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;flex:none;}
.dish-media img{width:100%;height:100%;object-fit:cover;display:block;}
.dish-media .dish-icon-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg, var(--surface-2), var(--surface-3));}
.dish-media .dish-icon-fallback svg{width:46px;height:46px;color:var(--brass-bright);opacity:.55;}
.dish-price-badge{position:absolute;bottom:9px;right:9px;background:rgba(20,17,13,.82);backdrop-filter:blur(4px);color:var(--brass-bright);font-family:var(--display);font-size:14px;letter-spacing:.03em;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);}
[dir="rtl"] .dish-price-badge{right:auto;left:9px;}
.dish-price-badge .price-old{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1.5px;margin-inline-end:7px;font-size:12px;}
.dish-discount-tag{position:absolute;top:9px;left:9px;background:var(--ember);color:#fff;font-family:var(--display);font-size:15px;letter-spacing:.05em;padding:4px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
[dir="rtl"] .dish-discount-tag{left:auto;right:9px;}
.dish-body{padding:15px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
.dish-name{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2;}
.dish-desc{color:var(--ink-dim);font-size:13.8px;line-height:1.5;flex:1;}
.dish-options{display:flex;flex-wrap:wrap;gap:6px;}
.dish-opt{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:11px;letter-spacing:.03em;color:var(--ink-dim);text-transform:uppercase;transition:all .15s ease;}
.dish-opt.active{background:var(--brass);border-color:var(--brass);color:#1a1508;}
.dish-opt:hover:not(.active){border-color:var(--brass);color:var(--ink);}
.dish-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;}
.stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;}
.stepper button{background:var(--surface-2);color:var(--ink);border:none;width:30px;height:30px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
.stepper button:hover{background:var(--surface-3);color:var(--brass-bright);}
.stepper .qty{width:24px;text-align:center;font-family:var(--display);font-size:14px;}
.dish-add{font-family:var(--display);font-size:12.5px;letter-spacing:.05em;background:var(--brass);color:#1a1508;border:none;border-radius:999px;padding:9px 16px;text-transform:uppercase;transition:all .15s ease;}
.dish-add:hover{background:var(--brass-bright);}
.dish-add.added{background:var(--pine-light);color:#eafff2;}

.overlay{position:fixed;inset:0;background:rgba(10,8,5,.6);backdrop-filter:blur(2px);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--void);border-inline-start:1px solid var(--line-strong);z-index:151;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
[dir="rtl"] .drawer{transform:translateX(-100%);}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);flex:none;}
.drawer-head h3{font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);}
.drawer-close{background:none;border:none;color:var(--ink-dim);padding:6px;}
.drawer-close svg{width:20px;height:20px;}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
.drawer-foot{padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--surface);flex:none;}
.cart-empty-msg{color:var(--ink-faint);text-align:center;padding:40px 10px;font-size:14px;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.cart-item-icon{width:28px;height:28px;flex:none;color:var(--brass-bright);}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-family:var(--serif);font-weight:600;font-size:15px;}
.cart-item-price{color:var(--ink-faint);font-size:12.5px;margin-top:2px;}
.cart-item-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.cart-item-remove{background:none;border:none;color:var(--ink-faint);font-size:11.5px;text-decoration:underline;padding:2px;}
.cart-item-remove:hover{color:var(--ember-bright);}
.foot-total-row{display:flex;align-items:baseline;justify-content:space-between;}
.foot-total-row .lbl{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--ink-dim);text-transform:uppercase;}
.foot-total-row .val{font-family:var(--display);font-size:21px;color:var(--brass-bright);}
.foot-fee-note{font-size:11.5px;color:var(--ink-faint);text-align:right;margin-top:1px;}
.foot-fee-note.free{color:var(--pine-light);}
.checkout-form{display:none;flex-direction:column;gap:14px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);}
.checkout-form.open{display:flex;}
.ordertype{display:flex;gap:8px;}
.ordertype button{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px;font-family:var(--display);font-size:12.5px;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;}
.ordertype button.active{background:var(--pine);border-color:var(--pine-light);color:var(--ink);}
.delivery-note{font-size:12px;color:var(--ink-faint);margin:-4px 0 0;line-height:1.5;}
.delivery-incentive{background:rgba(58,116,88,.16);border:1px solid rgba(58,116,88,.4);color:var(--pine-light);font-family:var(--display);font-size:12.5px;letter-spacing:.03em;padding:9px 12px;border-radius:10px;text-align:center;margin:14px 0 0;}
.delivery-incentive.achieved{background:rgba(201,162,39,.14);border-color:rgba(201,162,39,.4);color:var(--brass-bright);}
.min-order-warning{color:var(--ember-bright);font-size:11.5px;text-align:center;margin:8px 0 0;}
.cart-closed-notice{background:rgba(180,35,42,.14);border:1px solid rgba(180,35,42,.4);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;text-align:center;margin-top:8px;}
#cartClosedNotice[hidden]{display:none;}
.cart-closed-notice strong{font-family:var(--display);font-size:11px;letter-spacing:.05em;color:var(--ember-bright);text-transform:uppercase;}
.cart-closed-notice span{font-size:11.5px;color:var(--ink-dim);line-height:1.3;}
#cartActionBtn{margin-top:10px;}
#cartActionBtn[hidden]{display:none;}
.foot-links{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.link-btn{background:none;border:none;color:var(--ink-faint);text-decoration:underline;font-size:11.5px;padding:4px;cursor:pointer;font-family:var(--body);}
.link-btn:hover{color:var(--ink);}
.foot-sep{color:var(--ink-faint);font-size:11px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-family:var(--display);font-size:11.5px;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase;}
.field input, .field textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:var(--body);font-size:16px;width:100%;}
.field input:focus, .field textarea:focus{border-color:var(--brass);outline:none;}
.field textarea{resize:vertical;min-height:60px;}
.paymethod{display:flex;gap:8px;}
.paymethod button{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:11px;font-family:var(--display);font-size:12px;letter-spacing:.05em;color:var(--ink-dim);text-transform:uppercase;}
.paymethod button.active{background:var(--brass);border-color:var(--brass);color:#1a1508;}
.pay-panel{background:rgba(201,162,39,.07);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;}
.pay-panel[hidden]{display:none;}
.pay-instructions{font-size:13px;color:var(--ink-dim);margin:0;line-height:1.5;}
.qr-box{display:flex;justify-content:center;padding:6px;}
.qr-box img, .qr-box canvas{background:#fff;padding:8px;border-radius:8px;}
.bank-details{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px;}
.bank-details span{color:var(--ink-faint);font-size:12px;}
.field-error{color:var(--ember-bright);font-size:12px;display:none;}
.field-warning{color:var(--ember-bright);font-size:12.5px;display:none;line-height:1.4;}
.field.error input, .field.error textarea{border-color:var(--ember);}
.field.error .field-error{display:block;}
.field.outofrange input{border-color:var(--ember);}
.field.outofrange .field-warning{display:block;}

.ticket-overlay{position:fixed;inset:0;background:rgba(10,8,5,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.ticket-overlay.open{display:flex;}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;max-width:380px;width:100%;padding:28px 24px 24px;box-shadow:0 30px 90px rgba(0,0,0,.6);margin:auto;}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:26px;height:26px;background:var(--void);border-radius:50%;transform:translateY(-50%);}
.ticket::before{left:-13px;}
.ticket::after{right:-13px;}
.ticket-perf{border-top:2px dashed var(--line-strong);margin:16px 0;}
.ticket-head{text-align:center;}
.ticket-head .mark{width:54px;height:54px;margin:0 auto 10px;}
.ticket-head h3{font-family:var(--display);font-size:14px;letter-spacing:.1em;color:var(--brass-bright);text-transform:uppercase;}
.ticket-num{font-family:var(--serif);font-weight:700;font-size:32px;text-align:center;margin:8px 0 4px;}
.ticket-sub{text-align:center;color:var(--ink-faint);font-size:11.5px;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;}
.ticket-lines{font-size:13.5px;color:var(--ink-dim);margin:4px 0;max-height:150px;overflow-y:auto;}
.ticket-lines div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;}
.ticket-total{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px;color:var(--ink);padding-top:10px;border-top:1px solid var(--line);}
.ticket-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.ticket-note{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:14px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;}
.ticket-close{position:absolute;top:14px;inset-inline-end:14px;background:none;border:none;color:var(--ink-faint);}
.ticket-close svg{width:18px;height:18px;}

.footer{padding:54px 0 30px;}
.footer-grid{display:grid;grid-template-columns:1fr;gap:32px;}
@media(min-width:760px){.footer-grid{grid-template-columns:1.2fr 1fr 1fr;}}
.footer h4{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--brass-bright);text-transform:uppercase;margin-bottom:12px;}
.footer p{font-size:14px;color:var(--ink-dim);line-height:1.8;}
.footer a{font-size:14px;color:var(--ink-dim);text-decoration:none;line-height:1.9;display:inline-block;}
.footer a:hover{color:var(--brass-bright);}
.footer-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.footer-brand svg{width:38px;height:38px;flex:none;}
