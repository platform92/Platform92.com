<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform 92 Kitchen – Poster Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07150f;--pn:#0d2219;--ln:#27483b;--gold:#d4b06a;--gl:#f0d79a;--cr:#f5ecd6;--mut:#93ab9f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cr);font:15px/1.4 Jost,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--ln)}
header img{width:54px;height:54px;border-radius:50%}
h1{font:700 22px 'Playfair Display',Georgia,serif;margin:0;color:var(--gl)}
header small{color:var(--mut)}
main{display:grid;grid-template-columns:390px 1fr;gap:24px;padding:24px;max-width:1360px;margin:auto}
@media(max-width:880px){main{grid-template-columns:1fr}}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;align-self:start}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tabs button{padding:10px 8px;border-radius:8px;border:1px solid var(--ln);background:none;color:var(--cr);font:inherit;cursor:pointer;text-align:left}
.tabs button b{display:block;font:700 15px 'Playfair Display',serif}
.tabs button small{color:var(--mut)}
.tabs button.on{border-color:var(--gold);background:#16382b}
label{display:block;margin:10px 0 0;color:var(--mut);font-size:13px}
label i{font-style:normal;opacity:.7}
input[type=text],select{width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--ln);background:#06120d;color:var(--cr);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.sv input{border-style:dashed;color:var(--gl);padding:6px 10px;font-size:14px}
.sv{margin-top:4px}
.note{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:10px 16px;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--gl);font:500 14px Jost,sans-serif;cursor:pointer;margin:0;display:inline-block}
.btn.pri{background:linear-gradient(#e6c77f,#c39a4f);color:#0b231b;border-color:transparent;font-weight:500}
.btn:hover{filter:brightness(1.12)}
.stage{background:repeating-conic-gradient(#0a1b14 0 25%,#0c2018 0 50%) 0 0/24px 24px;border:1px solid var(--ln);border-radius:12px;padding:18px;display:flex;justify-content:center}
canvas{max-width:100%;max-height:78vh;width:auto;height:auto;box-shadow:0 10px 40px #000a}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.item{border:1px solid var(--ln);border-radius:10px;padding:4px 12px 12px;margin-top:12px}.ih{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.x{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline}
h3{font:700 16px 'Playfair Display',serif;color:var(--gl);margin:18px 0 0}.chk{display:flex;gap:8px;align-items:center;color:var(--cr);font-size:14px}.chk input{width:auto;margin:0;accent-color:#d4b06a}
.btn.sm{padding:6px 12px;font-size:13px}.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:230px;overflow:auto;margin-top:8px}.gal:empty{display:none}
.th{padding:0;border:1px solid var(--ln);border-radius:6px;background:#06120d;cursor:pointer;color:var(--cr);overflow:hidden;font:11px Jost,sans-serif}.th:hover{border-color:var(--gold)}
.th img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.th span{display:block;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><img id="hl" alt="Platform 92 Kitchen logo"><div><h1>Poster Studio</h1><small>Platform 92 Kitchen: posters for social media</small></div></header>
<main>
<section class="panel">
 <div class="tabs" id="tabs"></div>
 <div id="fields"></div>
 <p class="note" id="ist"></p>
 <div id="phbox"><label>Photo reference<input type="text" id="ph" placeholder="a  (reads photos/a.jpg or a.jpeg)"></label>
 <p class="note" id="pst"></p></div>
 <div class="row">
  <label class="btn">Select photos folder<input type="file" id="fd" webkitdirectory multiple hidden></label>
  <label class="btn" id="upl">Upload a photo instead<input type="file" id="up" accept="image/*" hidden></label>
 </div>
 <p class="note" id="fst"></p>
 <div class="gal" id="gal"></div>
 <label class="chk" style="margin-top:14px"><input type="checkbox" id="qr" checked>Show the website QR code on the offer and dish intro posters</label>
 <label>Poster language<select id="lang"><option value="sv">Swedish (auto-translated)</option><option value="en">English (as typed)</option></select></label>
 <label>Size<select id="fmt"></select></label>
 <label>File type<select id="ft"><option value="image/png">PNG (best quality)</option><option value="image/jpeg">JPG (smaller file)</option></select></label>
</section>
<section>
 <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>
 <div class="bar">
  <button class="btn pri" id="d1">Download this poster</button>
  <button class="btn" id="dS">Download all sizes</button>
  <button class="btn" id="dA">Download all posters</button>
  <button class="btn" id="cp">Copy caption prompt</button>
 </div>
 <p class="note" id="msg"></p>
</section>
</main>
