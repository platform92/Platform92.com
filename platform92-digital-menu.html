<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Platform 92 Kitchen — Digital Menu</title>
<meta name="description" content="Platform 92 Kitchen — digital menu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Platform 92 design tokens (edit here to re-theme the whole menu) ---- */
    --void:#14110D;         /* base background — near-black, warm charcoal for low-light reading */
    --surface:#1E1911;      /* card surface */
    --surface-2:#262016;    /* raised / hover surface */
    --line:rgba(201,162,39,0.22); /* brass hairline */
    --ink:#F4ECD8;          /* primary text — cream, high contrast on dark */
    --ink-dim:#C9BFA8;      /* secondary text */
    --brass:#C9A227;        /* primary accent — brass rim from the logo */
    --brass-bright:#E9C766; /* brass hover / highlight */
    --pine:#20503C;         /* forest green — logo enamel ring */
    --pine-light:#3A7458;
    --ember:#B4232A;        /* signal red — matches the brush-stroke headers on the original menu */
    --ember-bright:#D6444B;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:26px;
    --shadow-card: 0 6px 20px rgba(0,0,0,0.35);
    --shadow-pop: 0 16px 44px rgba(0,0,0,0.55);
    --display: "Bebas Neue", "Arial Narrow", sans-serif;
    --serif: "Fraunces", Georgia, serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --maxw: 620px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(32,80,60,0.35), transparent 60%),
      var(--void);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    min-height:100vh;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  ::selection{background:var(--brass);color:#1a1508;}
  :focus-visible{outline:2px solid var(--brass-bright);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #app{max-width:var(--maxw);margin:0 auto;position:relative;padding-bottom:96px;}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(20,17,13,0.98) 0%, rgba(20,17,13,0.96) 80%, rgba(20,17,13,0.9) 100%);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .header-top{display:flex;align-items:center;gap:12px;}
  .logo-badge{width:56px;height:56px;flex:none;border-radius:50%;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));}
  .header-titles{flex:1;min-width:0;}
  .header-titles .eyebrow{
    font-family:var(--display);letter-spacing:0.14em;font-size:12px;color:var(--brass-bright);
    text-transform:uppercase;
  }
  .header-titles h1{
    font-family:var(--serif);font-weight:600;font-size:22px;margin:0;color:var(--ink);
    letter-spacing:0.01em;
  }
  .header-titles .sub{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}

  .lang-row{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .lang-globe{font-size:14px;color:var(--ink-dim);margin-right:2px;flex:none;}
  .lang-btn{
    border:1px solid var(--line);background:transparent;color:var(--ink-dim);
    font-size:12.5px;font-weight:600;letter-spacing:0.02em;padding:6px 11px;border-radius:999px;
    cursor:pointer;transition:all .15s ease;
  }
  .lang-btn:hover{border-color:var(--brass);color:var(--ink);}
  .lang-btn.active{background:var(--brass);border-color:var(--brass);color:#1a1508;}

  /* ---------- Disclaimer banner ---------- */
  .disclaimer{
    display:none;gap:10px;align-items:flex-start;
    background:rgba(180,35,42,0.14);border:1px solid rgba(180,35,42,0.4);
    color:var(--ink);border-radius:var(--radius-s);
    margin:12px 16px 0;padding:10px 12px;font-size:12.5px;
  }
  .disclaimer.show{display:flex;}
  .disclaimer strong{color:var(--brass-bright);}
  .disclaimer .x{
    margin-left:auto;background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;
  }

  /* ---------- Filter bar ---------- */
  .filter-wrap{padding:14px 16px 4px;}
  .filter-label{font-family:var(--display);font-size:12.5px;letter-spacing:0.12em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .pill:hover{border-color:var(--pine-light);}
  .pill[aria-pressed="true"]{background:var(--pine);border-color:var(--pine-light);color:#eafff2;}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);opacity:0;}
  .pill[aria-pressed="true"] .dot{opacity:1;}
  .clear-filters{
    background:none;border:none;color:var(--ember-bright);font-size:12.5px;text-decoration:underline;
    cursor:pointer;padding:6px 2px;display:none;
  }
  .clear-filters.show{display:inline-block;}

  /* ---------- Signature / golden-triangle section ---------- */
  .signature{padding:22px 16px 6px;}
  .signature .eyebrow{
    font-family:var(--display);font-size:13px;letter-spacing:0.14em;color:var(--brass-bright);text-transform:uppercase;
  }
  .signature h2{font-family:var(--serif);font-size:21px;margin:2px 0 2px;font-weight:600;}
  .signature .sub{font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;}
  .tri-grid{
    display:grid;grid-template-columns:1fr;gap:14px;align-items:stretch;
  }
  .tri-grid .dish-card{opacity:0;transform:translateY(10px);animation:riseIn .5s ease forwards;}
  .tri-grid .dish-card:nth-child(1){animation-delay:.05s;}
  .tri-grid .dish-card:nth-child(2){animation-delay:.15s;}
  .tri-grid .dish-card:nth-child(3){animation-delay:.25s;}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
  .dish-card.featured-card{border-color:rgba(201,162,39,0.4);}
  .dish-card.featured-card.role-center{
    border-color:rgba(201,162,39,0.6);
    background:linear-gradient(160deg, #2c2415, var(--surface));
  }

  @media (min-width:560px){
    .tri-grid{grid-template-columns:repeat(3,1fr);}
  }

  /* ---------- Category sections ---------- */
  .menu-main{padding:8px 16px 0;}
  .cat-section{margin-top:26px;}
  .cat-header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .cat-header h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;color:var(--ink);}
  .cat-header .stroke{flex:1;height:2px;background:linear-gradient(90deg, var(--ember), transparent);border-radius:2px;}
  .cat-count{font-size:11.5px;color:var(--ink-dim);}

  .dish-list{display:grid;grid-template-columns:1fr;gap:14px;}
  @media (min-width:560px){ .dish-list{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:860px){ .dish-list{grid-template-columns:repeat(3,1fr);} }

  /* uniform photo-forward dish card — used for both the category list and House Favorites */
  .dish-card{
    position:relative;display:flex;flex-direction:column;height:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);
    overflow:hidden;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
    text-align:left;width:100%;color:inherit;
  }
  .dish-card:hover{border-color:var(--brass);}
  .dish-card:active{transform:scale(0.994);}
  .dish-photo{
    position:relative;width:100%;aspect-ratio:1/1;flex:none;overflow:hidden;
    background:radial-gradient(circle at 32% 28%, var(--pine-light), var(--pine));
  }
  .dish-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .dish-photo svg{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:34%;height:34%;color:var(--brass-bright);
  }
  .dish-body{flex:1;min-width:0;padding:13px 14px 14px;}
  .dish-body .name{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 4px;}
  .dish-body .desc{font-size:12.5px;color:var(--ink-dim);margin:0;line-height:1.5;}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .tag-chip{
    font-size:10.5px;font-weight:700;letter-spacing:0.03em;color:var(--pine-light);
    background:rgba(58,116,88,0.16);border:1px solid rgba(58,116,88,0.45);
    padding:2px 7px;border-radius:999px;text-transform:uppercase;
  }
  .tag-chip.fish{color:#7fb8d9;background:rgba(70,130,160,0.16);border-color:rgba(70,130,160,0.45);}

  /* the "token" price coin — signature visual element, sits on the photo like a stamped medallion */
  .coin{
    position:absolute;bottom:12px;right:12px;
    width:48px;height:48px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 32% 28%, var(--brass-bright), var(--brass) 65%, #8a6f1a 100%);
    color:#1a1508;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:15px;font-weight:400;letter-spacing:0.01em;
    box-shadow:0 3px 8px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.5);
    border:2px solid #7d631a;
  }

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius-m);margin-top:12px;
  }

  /* ---------- Footer ---------- */
  .site-footer{
    margin-top:40px;padding:22px 16px 30px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-dim);text-align:center;
  }
  .site-footer .brand{font-family:var(--serif);color:var(--ink);font-size:15px;margin-bottom:6px;}
  .site-footer .allergen-note{max-width:440px;margin:14px auto 0;font-size:11px;line-height:1.5;}
  .site-footer a{color:var(--brass-bright);text-decoration:none;}

  /* ---------- My Picks floating button + sheet ---------- */
  .picks-fab{
    position:fixed;right:16px;bottom:16px;z-index:50;
    background:var(--ember);color:#fff;border:none;border-radius:999px;
    padding:12px 18px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-pop);
    display:flex;align-items:center;gap:8px;cursor:pointer;
  }
  .picks-fab .count{
    background:rgba(255,255,255,0.25);border-radius:50%;width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;font-size:11px;
  }

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:var(--surface-2);width:100%;max-width:var(--maxw);
    border-radius:22px 22px 0 0;padding:18px 18px 26px;max-height:82vh;overflow-y:auto;
    border-top:1px solid var(--line);
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .sheet h3{font-family:var(--serif);margin:0 0 4px;font-size:19px;}
  .sheet .note{font-size:11.5px;color:var(--ink-dim);margin-bottom:14px;}
  .pick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .pick-row .name{flex:1;font-size:13.5px;}
  .pick-row .coin-mini{
    width:34px;height:34px;border-radius:50%;background:var(--brass);color:#1a1508;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12.5px;flex:none;
  }
  .pick-row .rm{background:none;border:none;color:var(--ember-bright);font-size:12px;cursor:pointer;padding:4px 6px;}
  .pick-total{display:flex;justify-content:space-between;padding-top:12px;font-size:14px;font-weight:700;}
  .sheet-close{
    margin-top:16px;width:100%;background:var(--brass);color:#1a1508;border:none;
    padding:12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;
  }

  /* ---------- Dish detail modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:70;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface-2);max-width:440px;width:100%;border-radius:var(--radius-l);
    padding:0 0 20px;border:1px solid var(--line);box-shadow:var(--shadow-pop);
    max-height:88vh;overflow-y:auto;animation:slideUp .2s ease;
  }
  .modal-photo{
    position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
    background:radial-gradient(circle at 32% 28%, var(--pine-light), var(--pine));
    border-radius:var(--radius-l) var(--radius-l) 0 0;
  }
  .modal-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .modal-photo svg{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:76px;height:76px;color:var(--brass-bright);
  }
  .modal-photo .coin{bottom:14px;right:14px;width:54px;height:54px;font-size:16px;}
  .modal-top{padding:16px 20px 0;}
  .modal h3{font-family:var(--serif);font-size:21px;margin:0 0 4px;}
  .modal-desc{font-size:13.5px;color:var(--ink-dim);margin:14px 20px 4px;line-height:1.6;}
  .modal .tag-row{margin-top:10px;padding:0 20px;}
  .pairs-box{
    margin:16px 20px 0;background:rgba(201,162,39,0.08);border:1px solid var(--line);
    border-radius:var(--radius-s);padding:12px;
  }
  .pairs-box .lbl{font-family:var(--display);font-size:11.5px;letter-spacing:0.1em;color:var(--brass-bright);text-transform:uppercase;margin-bottom:8px;}
  .pair-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:6px 10px 6px 6px;font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;
  }
  .pair-chip .mini-coin{
    width:22px;height:22px;border-radius:50%;background:var(--brass);color:#1a1508;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;
  }
  .modal-actions{display:flex;gap:10px;margin:18px 20px 0;}
  .btn{border:none;border-radius:999px;padding:12px 16px;font-weight:700;font-size:13.5px;cursor:pointer;flex:1;}
  .btn.primary{background:var(--ember);color:#fff;}
  .btn.primary.added{background:var(--pine);color:#eafff2;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);}

  .allergen-inline{font-size:10.5px;color:var(--ink-dim);margin:12px 20px 0;line-height:1.5;}
</style>
</head>

    t:{ sv:{name:"Läsk / Kaffe / Te", desc:"Välj mellan iskall läsk, varmt kaffe eller te."},
        en:{name:"Soft Drink / Coffee / Tea", desc:"Choose between an ice-cold soft drink, hot coffee, or tea."},
        de:{name:"Softdrink / Kaffee / Tee", desc:"Wählen Sie zwischen einem eiskalten Softdrink, heißem Kaffee oder Tee."},
        es:{name:"Refresco / Café / Té", desc:"Elige entre un refresco bien frío, café caliente o té."},
        fr:{name:"Soda / Café / Thé", desc:"Choisissez entre un soda bien frais, un café chaud ou un thé."} } }
];

/* rule-based pairing suggestions — no AI call, no cart/POS, just a lookup table */
var PAIRINGS = {
  cheeseburgare:["pommes_ost","drycker"],
  kyckling_cheeseburgare:["loaded_pommes","drycker"],
  combo_tallrik:["drycker"],
  kyckling_tallrik:["drycker"],
  notkott_tallrik:["drycker"],
  fisk_tallrik:["mixed_sallad","drycker"],
  falafel_tallrik:["drycker"],
  notkott_rulle:["kycklingnuggets","drycker"],
  kyckling_rulle:["pommes_ost","drycker"],
  pommes_falafel_rulle:["drycker"],
  loaded_pommes:["drycker"],
  pommes_ost:["drycker"],
  kycklingnuggets:["pommes_ost","drycker"],
  kycklingvingar:["loaded_pommes","drycker"],
  mixed_sallad:["drycker"],
  extras:[],
  drycker:[]
};

/* ------------------------------- STATE ------------------------------- */
var state = {
  lang: detectLang(),
  filters: { vegan:false, vegetarian:false, glutenFree:false, dairyFree:false },
  picks: [],
  autoDetected: true
};

function detectLang(){
  try{
    var cands = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
    for (var i=0;i<cands.length;i++){
      var code = (cands[i]||"").slice(0,2).toLowerCase();
      if (LANGS.indexOf(code) !== -1) return code;
    }
  }catch(e){}
  return "en";
}

function byId(id){ for(var i=0;i<DISHES.length;i++) if(DISHES[i].id===id) return DISHES[i]; return null; }
function dish_t(d){ return d.t[state.lang] || d.t.en; }
function ui(){ return UI[state.lang]; }

/* ------------------------------ RENDERING ------------------------------ */
function renderAll(){
  document.documentElement.lang = state.lang;
  renderLangRow();
  renderDisclaimer();
  renderFilterBar();
  renderSignature();
  renderMenu();
  renderFooter();
  renderPicksFab();
}

function renderLangRow(){
  var row = document.getElementById("langRow");
  var html = '<span class="lang-globe">🌐</span>';
  LANGS.forEach(function(code){
    html += '<button class="lang-btn'+(state.lang===code?' active':'')+'" data-lang="'+code+'" aria-pressed="'+(state.lang===code)+'">'+code.toUpperCase()+'</button>';
  });
  row.innerHTML = html;
  document.getElementById("headerSub").textContent = ui().subHeader;
}

function renderDisclaimer(){
  var box = document.getElementById("disclaimerBox");
  if (state.lang === "sv"){ box.classList.remove("show"); return; }
  document.getElementById("disclaimerStrong").textContent = ui().disclaimerStrong;
  document.getElementById("disclaimerText").textContent = ui().disclaimerText;
  box.classList.add("show");
}

function renderFilterBar(){
  document.getElementById("filterLabel").textContent = ui().filterTitle;
  var bar = document.getElementById("filterBar");
  var defs = [["vegan","vegan"],["vegetarian","vegetarian"],["glutenFree","glutenFree"],["dairyFree","dairyFree"]];
  var html = "";
  defs.forEach(function(pair){
    var key = pair[0];
    var on = state.filters[key];
    html += '<button class="pill" data-filter="'+key+'" aria-pressed="'+on+'"><span class="dot"></span>'+ui()[pair[1]]+'</button>';
  });
  bar.innerHTML = html;
  var anyOn = Object.keys(state.filters).some(function(k){return state.filters[k];});
  var existing = document.querySelector(".clear-filters");
  if (existing) existing.remove();
  var clearBtn = document.createElement("button");
  clearBtn.className = "clear-filters" + (anyOn ? " show" : "");
  clearBtn.textContent = ui().clearFilters;
  clearBtn.id = "clearFiltersBtn";
  document.querySelector(".filter-wrap").appendChild(clearBtn);
}

function passesFilters(d){
  var f = state.filters;
  if (f.vegan && !d.tags.vegan) return false;
  if (f.vegetarian && !d.tags.vegetarian) return false;
  if (f.glutenFree && !d.tags.glutenFree) return false;
  if (f.dairyFree && !d.tags.dairyFree) return false;
  return true;
}

function tagChips(d){
  var chips = "";
  if (d.tags.vegan) chips += '<span class="tag-chip">'+ui().vegan+'</span>';
  else if (d.tags.vegetarian) chips += '<span class="tag-chip">'+ui().vegetarian+'</span>';
  if (d.tags.glutenFree) chips += '<span class="tag-chip">'+ui().glutenFree+'</span>';
  if (d.tags.dairyFree) chips += '<span class="tag-chip">'+ui().dairyFree+'</span>';
  if (d.tags.fish) chips += '<span class="tag-chip fish">🐟</span>';
  return chips;
}

window.__p92IconFallback = function(imgEl, category){
  try{ imgEl.parentNode.innerHTML = ICONS[CAT_ICON[category]]; }catch(e){}
};

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function iconOrPhoto(d, sizeClass){
  if (d.photo){
    return '<img src="'+escAttr(d.photo)+'" alt="" onerror="window.__p92IconFallback(this,\''+d.category+'\')">';
  }
  return ICONS[CAT_ICON[d.category]];
}

function renderSignature(){
  document.getElementById("sigEyebrow").textContent = ui().signatureEyebrow;
  document.getElementById("sigTitle").textContent = "Platform 92 Kitchen";
  document.getElementById("sigSub").textContent = ui().signatureSubtitle;
  var order = {left:1, center:0, right:2};
  var featured = DISHES.filter(function(d){return d.featured;}).sort(function(a,b){return order[a.featured]-order[b.featured];});
  var grid = document.getElementById("triGrid");
  grid.innerHTML = featured.map(function(d){
    var tt = dish_t(d);
    return '<button class="dish-card featured-card role-'+d.featured+'" data-id="'+d.id+'" title="'+ui().tapForDetails+'">'
      + '<div class="dish-photo">'+iconOrPhoto(d)+'<div class="coin">'+d.price+'</div></div>'
      + '<div class="dish-body"><div class="name">'+tt.name+'</div><div class="desc">'+tt.desc+'</div><div class="tag-row">'+tagChips(d)+'</div></div>'
      + '</button>';
  }).join("");
}

function renderMenu(){
  var main = document.getElementById("menuMain");
  var anyVisible = false;
  var html = "";
  CATEGORIES.forEach(function(catId){
    var items = DISHES.filter(function(d){ return d.category===catId && passesFilters(d); });
    if (!items.length) return;
    anyVisible = true;
    html += '<section class="cat-section"><div class="cat-header"><h3>'+ui().categories[catId]+'</h3><div class="stroke"></div><div class="cat-count">'+items.length+'</div></div><div class="dish-list">';
    items.forEach(function(d){
      var tt = dish_t(d);
      html += '<button class="dish-card" data-id="'+d.id+'" title="'+ui().tapForDetails+'">'
        + '<div class="dish-photo">'+iconOrPhoto(d)+'<div class="coin">'+d.price+'</div></div>'
        + '<div class="dish-body"><div class="name">'+tt.name+'</div><div class="desc">'+tt.desc+'</div><div class="tag-row">'+tagChips(d)+'</div></div>'
        + '</button>';
    });
    html += '</div></section>';
  });
  if (!anyVisible){
    html = '<div class="empty-state">'+ui().noResults+'</div>';
  }
  main.innerHTML = html;
}

function renderFooter(){
  document.getElementById("currencyNote").textContent = ui().currencyNote;
  document.getElementById("allergenNote").textContent = ui().allergenNote;
}

function renderPicksFab(){
  var fab = document.getElementById("picksFab");
  document.getElementById("picksFabLabel").textContent = ui().myPicks;
  document.getElementById("picksCount").textContent = state.picks.length;
  fab.style.display = state.picks.length ? "flex" : "none";
}

/* ------------------------------ MODAL ------------------------------ */
function openModal(id){
  var d = byId(id);
  if (!d) return;
  var tt = dish_t(d);
  var already = state.picks.indexOf(id) !== -1;
  var suggestions = (PAIRINGS[id]||[]).map(byId).filter(Boolean);
  var pairsHtml = "";
  if (suggestions.length){
    pairsHtml = '<div class="pairs-box"><div class="lbl">'+ui().pairsWith+'</div>' +
      suggestions.map(function(s){
        var st = dish_t(s);
        return '<span class="pair-chip" data-goto="'+s.id+'"><span class="mini-coin">'+s.price+'</span>'+st.name+'</span>';
      }).join("") + '</div>';
  }
  var modal = document.getElementById("modalBody");
  modal.innerHTML =
    '<div class="modal-photo">'+iconOrPhoto(d)+'<div class="coin">'+d.price+'</div></div>' +
    '<div class="modal-top"><h3>'+tt.name+'</h3></div>' +
    '<div class="modal-desc">'+tt.desc+'</div>' +
    '<div class="tag-row">'+tagChips(d)+'</div>' +
    pairsHtml +
    '<div class="modal-actions">' +
      '<button class="btn primary'+(already?' added':'')+'" id="addPickBtn">'+(already?ui().addedToPicks:ui().addToPicks)+'</button>' +
      '<button class="btn ghost" id="closeModalBtn">'+ui().close+'</button>' +
    '</div>' +
    '<div class="allergen-inline">'+ui().allergenNote+'</div>';

  document.getElementById("addPickBtn").onclick = function(){
    var idx = state.picks.indexOf(id);
    if (idx === -1) state.picks.push(id); else state.picks.splice(idx,1);
    renderPicksFab();
    openModal(id);
  };
  document.getElementById("closeModalBtn").onclick = closeModal;
  modal.querySelectorAll(".pair-chip").forEach(function(chip){
    chip.onclick = function(){ openModal(chip.getAttribute("data-goto")); };
  });
  document.getElementById("modalOverlay").classList.add("show");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("show"); }

/* ------------------------------ MY PICKS SHEET ------------------------------ */
function openSheet(){
  document.getElementById("sheetTitle").textContent = ui().myPicks;
  document.getElementById("sheetNote").textContent = ui().myPicksNote;
  document.getElementById("sheetClose").textContent = ui().done;
  var list = document.getElementById("sheetList");
  var totalBox = document.getElementById("sheetTotal");
  if (!state.picks.length){
    list.innerHTML = '<div class="empty-state" style="margin-top:4px;">'+ui().myPicksEmpty+'</div>';
    totalBox.style.display = "none";
  } else {
    var total = 0;
    list.innerHTML = state.picks.map(function(id){
      var d = byId(id); var tt = dish_t(d); total += d.price;
      return '<div class="pick-row"><div class="coin-mini">'+d.price+'</div><div class="name">'+tt.name+'</div><button class="rm" data-id="'+id+'">'+ui().removeFromPicks+'</button></div>';
    }).join("");
    totalBox.style.display = "flex";
    totalBox.innerHTML = '<span>'+ui().total+'</span><span>'+total+'</span>';
    list.querySelectorAll(".rm").forEach(function(btn){
      btn.onclick = function(){
        var idx = state.picks.indexOf(btn.getAttribute("data-id"));
        if (idx !== -1) state.picks.splice(idx,1);
        renderPicksFab(); openSheet();
      };
    });
  }
  document.getElementById("sheetOverlay").classList.add("show");
}
function closeSheet(){ document.getElementById("sheetOverlay").classList.remove("show"); }

/* ------------------------------ EVENTS ------------------------------ */
document.addEventListener("click", function(e){
  var langBtn = e.target.closest(".lang-btn");
  if (langBtn){ state.lang = langBtn.getAttribute("data-lang"); state.autoDetected=false; renderAll(); return; }

  var filterPill = e.target.closest(".pill[data-filter]");
  if (filterPill){
    var key = filterPill.getAttribute("data-filter");
    state.filters[key] = !state.filters[key];
    renderFilterBar(); renderMenu(); return;
  }

  if (e.target.id === "clearFiltersBtn" || e.target.closest("#clearFiltersBtn")){
    Object.keys(state.filters).forEach(function(k){ state.filters[k]=false; });
    renderFilterBar(); renderMenu(); return;
  }

  if (e.target.id === "disclaimerClose"){ document.getElementById("disclaimerBox").classList.remove("show"); return; }

  var dishCard = e.target.closest(".dish-card");
  if (dishCard){ openModal(dishCard.getAttribute("data-id")); return; }

  if (e.target.id === "picksFab" || e.target.closest("#picksFab")){ openSheet(); return; }
  if (e.target.id === "sheetClose" || e.target === document.getElementById("sheetOverlay")){ closeSheet(); return; }
  if (e.target.id === "modalOverlay"){ closeModal(); return; }
});

renderAll();
})();
</script>
</body>
</html>
