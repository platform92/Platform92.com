<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F0F2EE; --surface:#E6EAE4; --ink:#10302B; --muted:#55706A; --line:#B9C6C0; --accent:#8A6A22; --badge:#F0F2EE;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
    --r:6px; --bar-h:0px;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark) { :root { --bg:#0D1A18; --surface:#152724; --ink:#E7ECE6; --muted:#93A9A2; --line:#2C443F; --accent:#D6AB52; } }
  *, *::before, *::after { box-sizing:inherit; }
  html { -webkit-text-size-adjust:100%; scroll-padding-top:calc(var(--bar-h) + 8px); }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
  .wrap { width:min(1040px,100%); margin-inline:auto; padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px)); }
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0; }
  .ic { width:1.1em; height:1.1em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* header */
  .hero { border-bottom:1px solid var(--line); }
  .hero .wrap { padding-block:16px 30px; }
  .hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; }
  .brandline { font-size:.9rem; font-weight:500; color:var(--muted); }
  .lang { position:relative; display:inline-flex; align-items:center; gap:8px; min-height:44px; border:1px solid var(--line); border-radius:999px; padding:0 12px; color:var(--ink); }
  .lang select { appearance:none; -webkit-appearance:none; background:transparent; border:0; color:inherit; font:inherit; font-size:.95rem; font-weight:500; padding:9px 4px; padding-inline-end:20px; cursor:pointer; }
  .lang select option { color:#10302B; background:#fff; }
  .lang::after { content:""; position:absolute; inset-inline-end:12px; top:50%; width:6px; height:6px; border-inline-end:2px solid currentColor; border-block-end:2px solid currentColor; transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .hero-main { display:flex; align-items:center; gap:18px; }
  .hero-main img { width:76px; height:auto; flex:none; background:var(--badge); border:1px solid var(--line); border-radius:50%; padding:5px; }
  h1 { margin:0; font:600 clamp(2.4rem,9vw,4.6rem)/.95 var(--serif); letter-spacing:-.01em; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
  .quick a { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; text-decoration:none; border:1px solid var(--line); border-radius:999px; font-size:.92rem; font-weight:500; }
  .quick a:hover { border-color:var(--accent); }
  .quick .ic { color:var(--accent); }
  .quick bdi, .f-list bdi, .hour bdi { direction:ltr; unicode-bidi:isolate; }

  /* sticky navigation */
  .bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; padding-block:10px 8px; }
  .tab { flex:1 1 0; min-width:0; min-height:44px; font:inherit; font-size:.92rem; font-weight:500; line-height:1.2; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:var(--r); padding:8px 6px; cursor:pointer; overflow-wrap:anywhere; }
  .tab[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .chips { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .chips::-webkit-scrollbar { display:none; }
  .chips[hidden] { display:none; }
  .chip { flex:none; min-height:44px; font:inherit; font-size:.92rem; font-weight:500; color:var(--muted); background:none; border:0; border-bottom:2px solid transparent; padding:10px 12px 8px; cursor:pointer; white-space:nowrap; }
  .chip[aria-current="true"] { color:var(--ink); border-bottom-color:var(--accent); }

  /* content */
  main { padding-block:0 48px; min-height:60vh; }
  .menu-head { padding-top:32px; }
  .menu-head h2 { margin:0; font:600 clamp(2.2rem,7vw,3.2rem)/1 var(--serif); }
  .lead { margin:8px 0 0; font:italic 500 1.25rem/1.35 var(--serif); color:var(--accent); }
  .hours { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:20px; }
  .hour { border-inline-start:2px solid var(--accent); padding-inline-start:14px; }
  .hour small { display:block; font-size:.85rem; font-weight:500; color:var(--muted); }
  .hour b { font:600 1.7rem/1.2 var(--serif); }

  .sec { padding-top:36px; }
  .sec h2 { margin:0 0 4px; padding-bottom:10px; border-bottom:1px solid var(--line); font:600 clamp(1.9rem,5.5vw,2.6rem)/1.05 var(--serif); }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr)); column-gap:56px; }
  .item { display:flex; gap:16px; padding:16px 0; border-bottom:1px dotted var(--line); }
  .item.feat { border-inline-start:2px solid var(--accent); padding-inline-start:14px; }
  .ph-box { flex:none; align-self:flex-start; width:84px; height:84px; border-radius:var(--r); overflow:hidden; background:var(--surface); }
  .ph-box img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; }
  .ph-box.ok img { opacity:1; transition:opacity .25s; }
  .items.big .ph-box { width:96px; height:96px; }
  @media (min-width:720px) { .ph-box { width:104px; height:104px; } .items.big .ph-box { width:132px; height:132px; } }
  .plus { flex:none; align-self:flex-start; width:28px; height:28px; margin-top:2px; border:1px solid var(--accent); border-radius:50%; display:grid; place-items:center; color:var(--accent); font:500 1.1rem/1 var(--sans); }
  .body { flex:1; min-width:0; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
  .name { margin:0; font:600 1.4rem/1.15 var(--serif); }
  .star { color:var(--accent); margin-inline-end:4px; }
  .tag { display:inline-block; vertical-align:middle; margin-inline-start:8px; font:500 .72rem/1 var(--sans); color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:3px 6px; }
  .price { flex:none; display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:baseline; gap:0 4px; max-width:46%; direction:ltr; unicode-bidi:isolate; font:600 1.05rem/1.3 var(--sans); font-variant-numeric:tabular-nums; text-align:right; }
  .price .cur { font-size:.75rem; font-weight:500; color:var(--muted); margin-inline-start:3px; }
  .price .sl { color:var(--muted); font-weight:400; }
  .price .one { white-space:nowrap; }
  .desc { margin:4px 0 0; max-width:54ch; color:var(--muted); font-size:.94rem; line-height:1.45; }
  .note { display:flex; align-items:center; gap:16px; margin:0; padding:14px 0; border-bottom:1px dotted var(--line); font:600 1.5rem/1.2 var(--serif); }

  /* footer */
  footer { border-top:1px solid var(--line); }
  footer .wrap { padding-block:32px 40px; display:flex; flex-wrap:wrap; gap:24px 40px; align-items:center; justify-content:space-between; }
  .f-brand { display:flex; align-items:center; gap:14px; }
  .f-brand img { width:56px; height:auto; background:var(--badge); border:1px solid var(--line); border-radius:50%; padding:4px; }
  .f-brand b { font:600 1.7rem/1.1 var(--serif); }
  .f-list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .f-list li { display:flex; align-items:center; gap:10px; font-size:.95rem; }
  .f-list .ic { color:var(--accent); }
  .f-list a { text-decoration:none; border-bottom:1px solid var(--line); }
  .f-list a:hover { border-bottom-color:var(--accent); }

  .hero-main img { padding:1px !important; border:1px solid var(--line) !important; }
  .f-brand img { padding:1px !important; }
  .logo { display:block; flex:none; line-height:0; border-radius:50%; }
  h1 a, .f-brand b a { color:inherit; text-decoration:none; }
  body, h1, h2, .name, .hour b, .note, .f-brand b { font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }

  @media (max-width:520px) {
    .hero-main { gap:14px; }
    .hero-main img { width:64px; }
    .tab { font-size:.84rem; }
    .name { font-size:1.28rem; }
    .price { max-width:50%; }
    .hours { grid-template-columns:1fr 1fr; gap:12px; }
    .hour b { font-size:1.3rem; }
    .hour small { font-size:.78rem; }
  }
  @media (prefers-reduced-motion:no-preference) { .tab, .chip, .quick a { transition:background-color .15s, border-color .15s, color .15s; } }
  @media print {
    body { background:#fff; color:#000; }
    .bar, .lang, .quick { display:none !important; }
    .item { break-inside:avoid; }
    .menu-head h2, .sec h2, .name, .price, .desc, .hour b, .hour small, .lead, .tag, .star { color:#000; }
  }
</style>

  const title = nice(T(s.title));
  const head = title ? `<h2 id="h-${s.id}">${esc(title)}</h2>` : "";
  const body = s.note ? `<div class="note">${photoHTML(s.photo, title)}<span>${esc(title)}</span></div>` : `<div class="items${menu !== "menu" ? " big" : ""}">${s.items.map(itemHTML).join("")}</div>`;
  return `<section class="sec" id="${s.id}"${title && !s.note ? ` aria-labelledby="h-${s.id}"` : ""}>${s.note ? "" : head}${body}</section>`;
}

function menuTitle(key) {
  return key === "menu" ? DATA.langs[lang].tab : nice(T(DATA.menus[key].title));
}

function render() {
  const L = DATA.langs[lang], M = DATA.menus[menu], I = DATA.info;
  document.documentElement.lang = lang;
  document.documentElement.dir = L.rtl ? "rtl" : "ltr";
  document.title = `${menuTitle(menu)} – ${I.name}`;

  $("quick").innerHTML =
    `<a href="${I.phoneHref}"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><span class="sr-only">${esc(L.phone)}: </span><bdi>${esc(I.phone)}</bdi></a>` +
    `<a href="${I.mapHref}" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><bdi>${esc(I.addressShort)}</bdi></a>` +
    `<a href="${I.webHref}"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><bdi>${esc(I.web)}</bdi></a>`;

  $("tabs").innerHTML = MENUS.map(k => `<button type="button" role="tab" class="tab" id="tab-${k}" data-menu="${k}" aria-selected="${k === menu}" tabindex="${k === menu ? 0 : -1}">${esc(menuTitle(k))}</button>`).join("");
  $("main").setAttribute("aria-labelledby", `tab-${menu}`);

  let head = "";
  if (menu !== "menu") {
    head = `<div class="menu-head"><h2>${esc(menuTitle(menu))}</h2>`;
    if (M.tag) head += `<p class="lead">${esc(T(M.tag))}</p>`;
    if (M.hours) head += `<div class="hours">${M.hours.map(h => `<div class="hour"><small>${esc(T(h.label))}</small><b>${esc(T(M.prefix))}<bdi>${esc(h.time)}</bdi></b></div>`).join("")}</div>`;
    head += `</div>`;
  }
  $("main").innerHTML = head + M.sections.map(sectionHTML).join("");

  const titled = M.sections.filter(s => T(s.title));
  const chips = $("chips");
  chips.hidden = titled.length < 2;
  chips.setAttribute("aria-label", ({ sv: "Kategorier", en: "Categories", ar: "الفئات", so: "Qaybaha", fa: "دسته‌ها", tr: "Kategoriler", pl: "Kategorie", uk: "Категорії" })[lang]);
  chips.innerHTML = titled.map(s => `<button type="button" class="chip" data-sec="${s.id}">${esc(nice(T(s.title)))}</button>`).join("");

  $("foot").innerHTML =
    `<li><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><a href="${I.mapHref}" target="_blank" rel="noopener"><bdi>${esc(I.address)}</bdi></a></li>` +
    `<li><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><span>${esc(L.phone)}:</span> <a href="${I.phoneHref}"><bdi>${esc(I.phone)}</bdi></a></li>` +
    `<li><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><a href="${I.webHref}"><bdi>${esc(I.web)}</bdi></a></li>`;

  spyList = titled.map(s => document.getElementById(s.id)).filter(Boolean);
  measure(); spy();
}

/* ---------- sticky bar height, scroll-spy, navigation ---------- */
function measure() { document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px"); }
function spy() {
  if (!spyList.length) return;
  const barH = $("bar").offsetHeight, atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  let cur = spyList[0];
  for (const el of spyList) if (el.getBoundingClientRect().top - barH - 40 <= 0) cur = el;
  if (atEnd) cur = spyList[spyList.length - 1];
  document.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.sec === cur.id;
    if (on && c.getAttribute("aria-current") !== "true") {
      const cr = c.getBoundingClientRect(), pr = $("chips").getBoundingClientRect();
      $("chips").scrollBy({ left: (cr.left + cr.width / 2) - (pr.left + pr.width / 2), behavior: reduce ? "auto" : "smooth" });
    }
    on ? c.setAttribute("aria-current", "true") : c.removeAttribute("aria-current");
  });
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });
addEventListener("resize", () => { measure(); spy(); });
if (window.ResizeObserver) new ResizeObserver(measure).observe($("bar"));

function goSection(id) {
  const el = document.getElementById(id); if (!el) return;
  const y = el.getBoundingClientRect().top + scrollY - $("bar").offsetHeight - 6;
  scrollTo({ top: Math.max(0, y), behavior: reduce ? "auto" : "smooth" });
}
function setMenu(k, push) {
  if (!MENUS.includes(k)) k = "menu";
  const changed = k !== menu; menu = k; render();
  if (push) history.replaceState(null, "", "#" + k);
  if (changed) { const h = document.querySelector(".hero").offsetHeight; if (scrollY > h) scrollTo({ top: h, behavior: "auto" }); }
}
function setLang(l, save) {
  if (!LANGS.includes(l)) l = "sv"; lang = l; if (save) store.set("p92-lang", l);
  $("lang").value = l; $("langLabel").textContent = nice(({ sv: "språk", en: "language", ar: "اللغة", so: "luqadda", fa: "زبان", tr: "dil", pl: "język", uk: "мова" })[l]);
  render();
}

photoEvents($("main"));
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setMenu(b.dataset.menu, true); });
$("tabs").addEventListener("keydown", e => {
  const i = MENUS.indexOf(menu), rtl = DATA.langs[lang].rtl; let n = -1;
  if (e.key === "ArrowRight") n = i + (rtl ? -1 : 1); else if (e.key === "ArrowLeft") n = i + (rtl ? 1 : -1);
  else if (e.key === "Home") n = 0; else if (e.key === "End") n = MENUS.length - 1;
  if (n < 0) return; e.preventDefault(); setMenu(MENUS[(n + MENUS.length) % MENUS.length], true); $("tab-" + menu).focus();
});
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) goSection(b.dataset.sec); });
$("lang").addEventListener("change", e => setLang(e.target.value, true));
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (MENUS.includes(k) && k !== menu) setMenu(k, false); });

/* ---------- start ---------- */
$("lang").innerHTML = LANGS.map(l => `<option value="${l}" lang="${l}">${esc(DATA.langs[l].label)}</option>`).join("");
const q = new URLSearchParams(location.search).get("lang");
const startLang = LANGS.includes(q) ? q : (LANGS.includes(store.get("p92-lang")) ? store.get("p92-lang") : "sv");
const h0 = location.hash.slice(1); if (MENUS.includes(h0)) menu = h0;
setLang(startLang, false);
</script>
</body>
</html>
