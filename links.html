<html lang="sv" dir="ltr">
<head>

<title>Platform 92 Kitchen</title>

<meta name="theme-color" content="#0D1A18" media="(prefers-color-scheme: dark)">

<style>
  :root {
    --bg:#F0F2EE; --surface:#E6EAE4; --ink:#10302B; --muted:#55706A; --line:#B9C6C0; --accent:#8A6A22;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
    --r:6px;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark) { :root { --bg:#0D1A18; --surface:#152724; --ink:#E7ECE6; --muted:#93A9A2; --line:#2C443F; --accent:#D6AB52; } }
  *, *::before, *::after { box-sizing:inherit; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; }
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0; }
  .ic { width:1.15em; height:1.15em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  bdi { direction:ltr; unicode-bidi:isolate; }

  .page { width:min(460px,100%); margin-inline:auto; padding:16px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px)); }

  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:34px; }
  .brandline { font-size:.9rem; font-weight:500; color:var(--muted); }
  .lang { position:relative; display:inline-flex; align-items:center; gap:8px; min-height:44px; border:1px solid var(--line); border-radius:999px; padding:0 12px; }
  .lang select { appearance:none; -webkit-appearance:none; background:transparent; border:0; color:inherit; font:inherit; font-size:.95rem; font-weight:500; padding:9px 4px; padding-inline-end:20px; cursor:pointer; }
  .lang select option { color:#10302B; background:#fff; }
  .lang::after { content:""; position:absolute; inset-inline-end:12px; top:50%; width:6px; height:6px; border-inline-end:2px solid currentColor; border-block-end:2px solid currentColor; transform:translateY(-70%) rotate(45deg); pointer-events:none; }

  .hero { text-align:center; }
  .badge { width:92px; height:92px; margin:0 auto 20px; border:1px solid var(--line); border-radius:50%; padding:5px; background:var(--bg); }
  .badge span { display:grid; place-items:center; width:100%; height:100%; border:2px solid var(--accent); border-radius:50%; font:600 2.2rem/1 var(--serif); color:var(--accent); font-variant-numeric:lining-nums; }
  h1 { margin:0; font:600 clamp(2.6rem,12vw,3.6rem)/.95 var(--serif); letter-spacing:-.01em; }
  .lead { margin:12px 0 0; font:italic 500 1.35rem/1.3 var(--serif); color:var(--accent); }

  .quick { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:24px; }
  .quick a { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; text-decoration:none; border:1px solid var(--line); border-radius:999px; font-size:.92rem; font-weight:500; }
  .quick a:hover { border-color:var(--accent); }
  .quick .ic { color:var(--accent); }

  .cta { display:flex; align-items:center; gap:12px; margin-top:34px; min-height:56px; padding:0 20px; text-decoration:none; background:var(--ink); color:var(--bg); border:1px solid var(--ink); border-radius:var(--r); font-size:1.02rem; font-weight:600; }
  .cta .ic:last-child { margin-inline-start:auto; }
  .cta:hover { background:transparent; color:var(--ink); }

  .sec { margin-top:40px; }
  .sec h2 { margin:0; padding-bottom:10px; border-bottom:1px solid var(--line); font:600 1.9rem/1.05 var(--serif); }
  .row { display:flex; align-items:center; gap:16px; padding:16px 0; text-decoration:none; border-bottom:1px dotted var(--line); }
  .row:hover .name { color:var(--accent); }
  .row .ic { width:1.3em; height:1.3em; color:var(--accent); }
  .name { margin:0; font:600 1.4rem/1.15 var(--serif); transition:color .15s; }
  .handle { margin-inline-start:auto; font-size:.9rem; color:var(--muted); direction:ltr; unicode-bidi:isolate; }

  footer { margin-top:44px; padding-top:24px; border-top:1px solid var(--line); text-align:center; }
  footer b { display:block; font:600 1.5rem/1.1 var(--serif); }
  footer span { font-size:.92rem; color:var(--muted); }

  [dir="rtl"] .cta .ic:last-child { transform:scaleX(-1); }
  @media (prefers-reduced-motion:no-preference) { .cta, .quick a { transition:background-color .15s, border-color .15s, color .15s; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>

  <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M14 4v10.2a3.3 3.3 0 1 1-2.6-3.23"/><path d="M14 4c.6 2.6 2.3 4.2 5 4.6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/></symbol>
</svg>

<div class="page">

  <header class="hero">

    <div class="quick">

      <a href="https://www.google.com/maps/search/?api=1&query=Stationsgatan+6A%2C+567+30+Vaggeryd" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><bdi>Stationsgatan 6A, Vaggeryd</bdi></a>
    </div>

    <a class="row" href="https://www.instagram.com/platform.92" target="_blank" rel="noopener noreferrer"><svg class="ic" aria-hidden="true"><use href="#i-insta"/></svg><h3 class="name">Instagram</h3><span class="handle">@platform.92</span></a>
    <a class="row" href="https://www.tiktok.com/@platform_92" target="_blank" rel="noopener noreferrer"><svg class="ic" aria-hidden="true"><use href="#i-tiktok"/></svg><h3 class="name">TikTok</h3><span class="handle">@platform_92</span></a>

  </section>

  <footer><b>Platform 92 Kitchen</b><span>Stationsgatan 6A · 567 30 Vaggeryd</span></footer>

<script>
const L = {
  sv:{n:"Svenska",rtl:0,lang:"Språk",phone:"Tel",tag:"En perrong. Alla välkomna.",btn:"Se menyn",find:"Hitta oss",rev:"Lämna en recension"},
  en:{n:"English",rtl:0,lang:"Language",phone:"Phone",tag:"One platform. Everyone welcome.",btn:"View the menu",find:"Find us",rev:"Leave a review"},
  ar:{n:"العربية",rtl:1,lang:"اللغة",phone:"هاتف",tag:"رصيف واحد. الجميع مرحّب بهم.",btn:"عرض القائمة",find:"تجدنا هنا",rev:"اترك تقييمًا"},
  so:{n:"Soomaali",rtl:0,lang:"Luqadda",phone:"Taleefan",tag:"Hal rasiif. Qof kasta waa ku soo dhawaaday.",btn:"Fiiri liiska cuntada",find:"Nala soo hel",rev:"Ka tag dib-u-eegis"},
  fa:{n:"فارسی",rtl:1,lang:"زبان",phone:"تلفن",tag:"یک سکو. همه خوش آمدند.",btn:"مشاهده منو",find:"ما را پیدا کنید",rev:"نظر خود را بنویسید"},
  tr:{n:"Türkçe",rtl:0,lang:"Dil",phone:"Telefon",tag:"Tek peron. Herkese hoş geldiniz.",btn:"Menüyü gör",find:"Bizi bulun",rev:"Yorum bırakın"},
  pl:{n:"Polski",rtl:0,lang:"Język",phone:"Tel.",tag:"Jeden peron. Wszyscy mile widziani.",btn:"Zobacz menu",find:"Znajdź nas",rev:"Zostaw opinię"},
  uk:{n:"Українська",rtl:0,lang:"Мова",phone:"Тел.",tag:"Одна платформа. Всім раді.",btn:"Переглянути меню",find:"Знайдіть нас",rev:"Залишити відгук"}
};
const KEYS = Object.keys(L), $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

function setLang(code, save){
  if (!L[code]) code = "sv";
  const t = L[code];
  document.documentElement.lang = code;
  document.documentElement.dir = t.rtl ? "rtl" : "ltr";
  $("lang").value = code;
  $("langLabel").textContent = t.lang;
  $("phoneLabel").textContent = t.phone + ": ";
  $("tagline").textContent = t.tag;
  $("btnLabel").textContent = t.btn;
  $("findLabel").textContent = t.find;
  $("reviewLabel").textContent = t.rev;
  if (save) store.set("p92-lang", code);
}

$("lang").innerHTML = KEYS.map(k => `<option value="${k}" lang="${k}">${L[k].n}</option>`).join("");
$("lang").addEventListener("change", e => setLang(e.target.value, true));
const q = new URLSearchParams(location.search).get("lang"), saved = store.get("p92-lang");
setLang(L[q] ? q : (L[saved] ? saved : "sv"), false);
</script>
